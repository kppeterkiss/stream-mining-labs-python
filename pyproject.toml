[project]
name = "stream-mining-labs-python"
version = "0.1.0"
description = "Python Apache Flink stream-mining practicals"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
	"apache-flink==1.20.5",
	"river==0.20.1",
	"numpy==1.24.4",
	"scipy==1.15.3",
	"setuptools<82",
]
[tool.uv]
package = true

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_mining"]

[tool.uv.extra-build-dependencies]
apache-beam = ["setuptools<82"]
